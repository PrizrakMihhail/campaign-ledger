name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_catalogue:
        description: Refresh the Wahapedia catalogue before deploying
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ inputs.refresh_catalogue }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Wahapedia faction data
        if: ${{ inputs.refresh_catalogue }}
        timeout-minutes: 10
        run: python tools/sync_wahapedia.py

      - name: Verify static site
        run: node tools/check.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
